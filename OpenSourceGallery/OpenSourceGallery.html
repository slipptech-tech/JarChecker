<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarChecker OpenSource File Photos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s forwards;
            cursor: pointer;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .image-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .image-wrapper img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Modal window */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <h1>JarChecker OpenSource File Photos</h1>

    <div class="gallery-container">
        <!-- Card 1 -->
        <div class="card" onclick="openModal(this)">
            <div class="image-wrapper">
                <img src="image1.png" alt="Open Source Files">
            </div>
            <div class="card-content">
                <div class="card-title">Open Source Files</div>
                <div class="card-desc">System DLLs and Python modules</div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card" onclick="openModal(this)">
            <div class="image-wrapper">
                <img src="image2.png" alt="Translations">
            </div>
            <div class="card-content">
                <div class="card-title">PySide6 Translations</div>
                <div class="card-desc">Language packs and localization (.qm)</div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card" onclick="openModal(this)">
            <div class="image-wrapper">
                <img src="image3.png" alt="Plugins">
            </div>
            <div class="card-content">
                <div class="card-title">PySide6 Plugins</div>
                <div class="card-desc">Internal platform plugins and styles</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        function openModal(cardElement) {
            const img = cardElement.querySelector('img');
            if (!img || !img.src) return;
            
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('active');
                modalImg.src = img.src;
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
