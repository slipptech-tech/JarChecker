<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarChecker — Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный градиент на заднем фоне */
        .bg-gradient {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00f0ff, #ff007f);
            background-size: 400% 400%;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            animation: gradientAnimation 12s ease infinite;
            z-index: 1;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Контейнер по центру */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            max-width: 420px;
            width: 90%;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Кнопка DOWNLOAD */
        .download-btn {
            display: block;
            width: 100%;
            background: #fff;
            color: #000;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        .download-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* Копирайт */
        .footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #555;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Анимированное фоновое свечение -->
    <div class="bg-gradient"></div>

    <div class="container">
        <h1>JarChecker</h1>
        <p>OpenSource.zip &bull; 47 MB</p>
        
        <!-- Кнопка скачивания с вашего Google Диска -->
        <a href="https://drive.google.com/uc?export=download&id=1Axj-Ntav_wazt94os0qdQ5bNfsV_BO39" class="download-btn">DOWNLOAD</a>
        
        <div class="footer-text">
            SlippTech 2026. All rights reserved.
        </div>
    </div>

</body>
</html>
